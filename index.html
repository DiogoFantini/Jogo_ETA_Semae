<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto 3D - Babylon.js</title>
    
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <script src="https://cdn.babylonjs.com/materialsLibrary/babylonjs.materials.min.js"></script>

    <style>
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #000; font-family: Arial, sans-serif; }
        #renderCanvas { width: 100%; height: 100%; touch-action: none; }

        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            gap: 10px;
            z-index: 10;
            pointer-events: none;
        }

        .hud-button {
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: 2px solid #4CAF50;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .hud-button:hover { transform: scale(1.05); }
        .hud-button:active { transform: scale(0.95); }

        /* ESTILO ESPECÍFICO DO BOTÃO DE DEMOLIÇÃO */
        #btnDesconstruir {
            border-color: #f44336;
            display: none; /* Começa escondido */
        }
    </style>
</head>
<body>
    <div id="hud">
        <button id="btnConstruir" class="hud-button">Construir</button>
        <button id="btnDesconstruir" class="hud-button">Desconstruir</button>
    </div>

    <canvas id="renderCanvas"></canvas>

    <script type="module" src="./js/game.js"></script>
</body>
</html>
